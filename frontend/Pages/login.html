<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../Assets/favicon.ico">
    <title>TicketFlow - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Styles/Paleta.css">
    <link rel="stylesheet" href="../Styles/StyleSections/Body.css">
    <link rel="stylesheet" href="../Styles/StylePages/LoginPage.css"> 
</head>
<body class="d-flex align-items-center justify-content-center login-wrapper">

    <div class="card p-4 shadow-lg login-card">
        <h2 class="text-center mb-4 login-title">TicketFlow</h2>
        <form id="login-form">
            <div class="mb-3">
                <label class="login-label">Email</label>
                <input type="email" id="email" class="form-control text-white login-input" required>
            </div>
            <div class="mb-4">
                <label class="login-label">Contraseña</label>
                <div class="input-group login-input-group">
                    <input type="password" id="password" class="form-control text-white login-input" required>
                    <button class="btn btn-toggle-password" type="button" id="togglePassword">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn w-100 btn-login">Ingresar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../Js/Controllers/LoginController.js"></script>
</body>
</html>
