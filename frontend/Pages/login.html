<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/Paleta.css">
    <link rel="stylesheet" href="../Styles/StyleSections/Body.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card p-4 shadow-lg" style="background-color: var(--card-bg); border: 1px solid #374151; max-width: 400px; width: 100%; border-radius: 12px;">
        <h2 class="text-center mb-4" style="color: var(--neon-purple); font-weight: 800;">TicketFlow</h2>
        <form id="login-form">
            <div class="mb-3">
                <label style="color: var(--text-muted);">Email</label>
                <input type="email" id="email" class="form-control text-white" style="background-color: #1f2937; border: none;" required>
            </div>
            <div class="mb-4">
                <label style="color: var(--text-muted);">Contraseña</label>
                <input type="password" id="password" class="form-control text-white" style="background-color: #1f2937; border: none;" required>
            </div>
            <button type="submit" class="btn w-100" style="background-color: var(--neon-purple); color: white; font-weight: bold;">
                Ingresar
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../Js/Controllers/LoginController.js"></script>
</body>
</html>
